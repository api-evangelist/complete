aid: complete
name: Complete
description: 'Complete is a compensation management platform that helps companies design,
  manage, and communicate employee compensation with clarity — from job offers and
  team leveling through planning, total rewards, and ongoing team monitoring. The
  product suite includes Interactive Offers (digital offer portals for candidates),
  Team Leveling (career progression frameworks and salary bands), Planning (spreadsheet-free
  compensation budgeting), Total Rewards (employee-facing statements of full compensation
  value), and Compy, a set of AI agents that automate compensation-cycle prep, offer
  generation, band building, and rewards analysis. Complete connects to compensation
  data through 100+ HRIS, ATS, and equity integrations (Workday, BambooHR, Gusto,
  Rippling, Ashby, and others). The company is a portfolio company of Accel and was
  added to the API Evangelist network as a lead for enrichment. Complete does not
  currently publish a public developer API, developer portal, or OpenAPI; its integration
  surface is delivered as prebuilt HRIS/ATS/equity connectors rather than a documented
  public API.'
